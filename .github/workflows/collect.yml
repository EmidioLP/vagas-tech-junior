# Coleta manual: roda o mesmo comando da maquina local (`python main.py`) e grava
# no banco do Secret DATABASE_URL. Sem agendamento nesta etapa.
#
# Regras de seguranca (verificadas em tests/test_workflows.py):
# - DATABASE_URL so vem de secrets e so entra no env dos passos que precisam dela;
# - inputs chegam aos scripts por env, nunca interpolados dentro de `run`;
# - sem `-v`: o log DEBUG pode trazer a mensagem do driver com o host do banco;
# - so sobe como artefato o log sanitizado, porque a mascara de secrets do GitHub
#   vale para o log do job, nao para arquivos enviados.
#
# Guia: docs/automation.md
name: Coleta manual

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "banco grava no DATABASE_URL; sem-banco so testa os portais (--no-db --csv)"
        type: choice
        options: [banco, sem-banco]
        default: banco
      fontes:
        description: "Fontes separadas por espaco; vazio = todas (gupy vagas programathor trampos linkedin querovagastech geekhunter)"
        type: string
        required: false
        default: ""
      max_paginas:
        description: "Maximo de paginas por termo, por portal"
        type: string
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    name: Coletar vagas
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Coletar
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODO: ${{ inputs.modo }}
          FONTES: ${{ inputs.fontes }}
          MAX_PAGINAS: ${{ inputs.max_paginas }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p coleta
          if ! [[ "$MAX_PAGINAS" =~ ^[1-9][0-9]*$ ]]; then
            echo "max_paginas precisa ser um inteiro positivo." >&2
            exit 2
          fi

          args=(--max-pages "$MAX_PAGINAS" --resumo coleta/resumo.md)
          if [[ -n "${FONTES// /}" ]]; then
            read -ra fontes <<< "$FONTES"
            args+=(--sources "${fontes[@]}")
          fi
          if [[ "$MODO" == "sem-banco" ]]; then
            args+=(--no-db --csv --no-charts)
          fi

          # shell: bash roda com pipefail: o exit code do main.py nao se perde no tee.
          python main.py "${args[@]}" 2>&1 | tee coleta/coleta.log

      - name: Publicar resumo
        if: always()
        shell: bash
        run: |
          if [[ -f coleta/resumo.md ]]; then
            cat coleta/resumo.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "A coleta terminou sem resumo. Veja o log do passo Coletar." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sanitizar log
        if: failure()
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [[ -f coleta/coleta.log ]]; then
            python scripts/sanitizar_log.py coleta/coleta.log coleta/coleta.sanitizado.log
          fi

      - name: Enviar diagnostico
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coleta-diagnostico-${{ github.run_id }}
          path: |
            coleta/coleta.sanitizado.log
            coleta/resumo.md
          retention-days: 7
          if-no-files-found: ignore
