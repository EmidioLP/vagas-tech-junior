# Deploy da API no Render (https://render.com).
#
# O banco e o Neon, branch `dados-main` (veja docs/neon-setup.md). A URL fica so
# no painel do Render: `sync: false` declara a variavel sem valor no git.
#
# O boot so sobe a API, que le o historico gravado pela coleta automatica na
# `dados-main`. Nada e importado nem migrado no boot: o banco persiste, e fazer
# isso a cada vez que o servico do plano free acorda custaria minutos. Migrations
# na `dados-main` sao aplicadas a mao (docs/neon-setup.md).
#
# O scraper nao roda aqui de proposito: portais de vaga costumam bloquear IP de
# nuvem. A coleta automatica roda no GitHub Actions (docs/automation.md).

services:
  - type: web
    name: vagas-tech-junior-api
    runtime: python
    plan: free
    region: oregon

    buildCommand: pip install -r requirements-api.txt

    # 0.0.0.0 e nao 127.0.0.1, senao o Render nao alcanca o processo.
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # URL pooled da branch Neon `dados-main`, cadastrada no painel do Render.
      - key: DATABASE_URL
        sync: false
