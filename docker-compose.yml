# API + PostgreSQL.
#
#     docker compose up --build
#     -> http://localhost:8000/docs
#
# No boot, a API aplica as migrations e carrega seed/vagas.csv no historico
# (jobs + job_snapshots), como se fosse a coleta de 15/09/2026. A carga e
# idempotente, entao subir de novo nao duplica nada. Nao precisa de rede.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vagas
      POSTGRES_PASSWORD: vagas
      POSTGRES_DB: vagas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposto para dar para inspecionar o banco de fora (psql, DBeaver).
      - "5432:5432"
    healthcheck:
      # A API so sobe depois que o Postgres aceita conexao de verdade. Sem
      # isso, `depends_on` liberaria a API assim que o container existisse,
      # e a importacao falharia no primeiro `docker compose up`.
      test: ["CMD-SHELL", "pg_isready -U vagas -d vagas"]
      interval: 3s
      timeout: 5s
      retries: 15

  api:
    build: .
    environment:
      # Unica coisa que muda em relacao a rodar local: para onde o banco aponta.
      DATABASE_URL: postgresql://vagas:vagas@db:5432/vagas
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # A data da coleta do seed e fixa no script (`DATA_DO_SEED`): datas
    # relativas ("Ontem") nao mudam a cada `up`. Atualize junto com o CSV.
    command: >-
      sh -c "alembic upgrade head &&
      python scripts/carregar_seed.py &&
      uvicorn api.app:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      # Migrations + carga de ~600 vagas antes do uvicorn subir.
      start_period: 60s

volumes:
  postgres_data:
